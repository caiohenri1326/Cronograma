<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ola!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="home" id="home">
        <h1>Deseja Criar um novo Cronograma?</h1>
        <button id="PerguntarCronograma" class="criarCronograma">+ Nova Tarefa</button>
    </div>

    <div class="modal" id="modal">
        <div class="modal-head">
            <p>Nova Tarefa</p>
            <button onclick="CloseTask()">X</button>
        </div>
        <div class="questions">
            <div class="quest_1">
                <label>O que você precisa fazer?</label>
                <input type="text">
            </div>
            <div class="quest_2">
                <label>Qual é o tipo dessa tarefa?</label>
                <select name="" id="select_task">
                    <option value="" disabled selected>Selecione um tipo de categoria</option>
                    <option value="Compromisso">Compromissos</option>
                    <option value="Contas">Contas / Finanças</option>
                    <option value="TarefasGerais"> Tarefa Geral</option>
                </select>
            </div>
            <div class="buttons_task">
                <button class="cancel" onclick="cancelAction()">Cancelar</button>
                <button class="advanced" onclick="AvancedNext()">Avançar ></button>
            </div>
        </div>


        <!-- ABA DE FINANÇAS -->
         
        <div class="financa">
            <div class="head_financa">
                <p>Planejamento Finanças - Passo 1 de 2</p>
            </div>
            <div class="quest-financa">
                <label>Qual é o seu Salário / Renda Total do Mês?</label>
                <input type="number" placeholder="R$ 0,00">
            </div>
            <div class="buttons_task">
                <button class="cancel" onclick="cancelAction()">Cancelar</button>
                <button class="advanced" onclick="AvancedNext()">Avançar ></button>
            </div>
        </div>
    </div>
</body>
<script src="../Back-end/script.js" defer></script>
</html>
